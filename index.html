<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D model of a 1:16 RC buggy, shown as systems: pick one to see how electricity becomes movement, or how the springs soak up bumps.">
<title>Shuttle 08 Teardown</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='22' width='44' height='16' rx='5' fill='%231c5fe0'/%3E%3Ccircle cx='18' cy='42' r='9' fill='%23152238'/%3E%3Ccircle cx='46' cy='42' r='9' fill='%23152238'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Nunito:wght@500;600;700;800&display=swap">
</head>
<body>
<main class="bay" id="bay">
  <canvas id="car" aria-label="3D model of the buggy driving over rough ground. Drag to rotate, scroll to zoom, click a part of the lit-up system to make it see-through."></canvas>
  <div class="labels" id="labels"></div>

  <aside class="shelf glass" id="shelf" aria-label="Systems">
    <header class="shelf-head">
      <span class="brand">SHUTTLE <b>08</b></span>
      <span class="tools">
        <button class="mini" id="b-whole" title="The whole car, solid">Whole car</button>
        <button class="mini" id="b-shelf" aria-expanded="true" aria-controls="shelf-body">Systems</button>
      </span>
    </header>
    <div id="shelf-body"></div>
  </aside>

  <section class="dock glass" aria-label="The system's chain and motion">
    <p class="dock-head" id="dock-head"></p>
    <div class="dock-row">
      <div class="chain" id="chain"></div>
      <div class="controls" id="controls"></div>
    </div>
  </section>

  <div class="ride glass" id="ride" hidden>
    <canvas id="ride-c" aria-label="Graph of the front-left wheel's bumps compared with the body above it"></canvas>
    <div class="key"><span><i style="background:var(--glow)"></i>Wheel</span><span><i style="background:var(--blue)"></i>Body</span><span id="ride-feel"></span></div>
  </div>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
